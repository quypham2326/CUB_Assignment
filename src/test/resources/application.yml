spring:
  application:
    name: currency-exchange-test
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none  # Recreate schema for each test
    defer-datasource-initialization: true
    show-sql: false  # Set to true for debugging

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql
api:
  exchange-rates: http://localhost:8081/v1/rates
cron:
  time: '-'
  area: Asia/Ho_Chi_Minh